name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONNOUSERSITE: "1"

jobs:
  verify:
    name: Python tests, evaluations and package
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SOURCE_SHA: ${{ github.sha }}
      CI_OUTPUT_DIR: .validation/ci
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/test.lock

      - name: Set up Node.js for Firebase CLI
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Set up Java for Firestore Emulator
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Require PowerShell 7 for deployment tests
        shell: pwsh
        run: |
          if ($PSVersionTable.PSVersion.Major -ne 7) {
            throw 'PowerShell 7 is required for the complete test suite.'
          }

      - name: Install hash-pinned test dependencies and product package
        run: |
          python -m pip install --require-hashes -r requirements/test.lock
          python -m pip install --no-deps --no-build-isolation .
          npm install --global firebase-tools@15.34.0

      - name: Run the complete Linux verification gate
        run: >-
          python deploy/run-rollout-checks.py
          --source-sha "$SOURCE_SHA"
          --output "$CI_OUTPUT_DIR"
